name: experiments

# Ручной запуск исследовательских экспериментов (раздел 5) на реальном
# GitHub Actions раннере, а не локально. Не привязан к pull_request —
# запускается вручную через вкладку Actions -> experiments -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      power_trials:
        description: "TRIALS для power_analysis.sh"
        default: "5"
      power_counts:
        description: "COUNTS для power_analysis.sh"
        default: "3 5 10 20"
      overhead_trials:
        description: "TRIALS для overhead.sh"
        default: "10"

permissions:
  contents: write

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create local tracking branches for all scenarios
        run: |
          git fetch origin 'refs/heads/*:refs/remotes/origin/*'
          for b in main regression/extra-allocation regression/quadratic-dedup regression/latency regression/memory-growth; do
            git branch --track "$b" "origin/$b" 2>/dev/null || true
          done

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Recapture baseline on this runner and sync it to all branches
        # benchmarks/baseline.txt (и baseline-*.pprof) были изначально сняты
        # на ноутбуке разработчика (Intel i5-10300H), а не на раннере
        # GitHub Actions. Сравнение "раннер vs. ноутбук" примешивает разницу
        # железа к любому результату sensitivity/power/overhead и к
        # perf-check.yml на реальных PR. Пересъём здесь и синхронизация во
        # все ветки regression/* делает эталон и кандидата сопоставимыми:
        # оба измерены на одном и том же классе раннера.
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          go test ./app/... -bench=. -benchmem -run=^$ -count=10 >benchmarks/baseline.txt
          ./scripts/capture-baseline-profiles.sh

          git add benchmarks/baseline.txt benchmarks/baseline-cpu.pprof benchmarks/baseline-mem.pprof
          git diff --cached --quiet || git commit -m "Recapture baseline on GitHub Actions runner (runner-native comparison)"
          git push origin HEAD:main

          mkdir -p /tmp/baseline-sync
          cp benchmarks/baseline.txt benchmarks/baseline-cpu.pprof benchmarks/baseline-mem.pprof /tmp/baseline-sync/

          for b in regression/extra-allocation regression/quadratic-dedup regression/latency regression/memory-growth; do
            git checkout -q "$b"
            cp /tmp/baseline-sync/* benchmarks/
            git add benchmarks/baseline.txt benchmarks/baseline-cpu.pprof benchmarks/baseline-mem.pprof
            git diff --cached --quiet || git commit -m "Sync runner-native baseline from main"
            git push origin "HEAD:$b"
          done

          git checkout -q main

      - name: Run sensitivity.sh (5.2)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          ./scripts/experiments/sensitivity.sh
          # sensitivity.sh пишет результат прямо в отслеживаемый файл, не
          # коммитя его. Если оставить как есть, следующий скрипт (который
          # тоже переключает ветки) откажется работать — git checkout не
          # даст затереть этот незакоммиченный файл. Коммитим сразу.
          git add experiments/sensitivity_results.csv
          git diff --cached --quiet || git commit -m "Update sensitivity_results.csv (runner-native)"
          git push origin HEAD:main

      - name: Run power_analysis.sh (5.2)
        env:
          TRIALS: ${{ github.event.inputs.power_trials }}
          COUNTS: ${{ github.event.inputs.power_counts }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          ./scripts/experiments/power_analysis.sh
          git add experiments/power_results.csv
          git diff --cached --quiet || git commit -m "Update power_results.csv (runner-native)"
          git push origin HEAD:main

      - name: Run overhead.sh (5.3)
        env:
          TRIALS: ${{ github.event.inputs.overhead_trials }}
          COUNT: "10"
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          ./scripts/experiments/overhead.sh
          git add experiments/overhead_results.csv
          git diff --cached --quiet || git commit -m "Update overhead_results.csv (runner-native)"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: experiments/*.csv
